name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example, v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !github.event.deleted)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag in the form vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Check POM versions and record build commit
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          python3 - "$version" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          expected = sys.argv[1]
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          for pom in ("pom.xml", "beekit-bom/pom.xml", "beekit-oss/pom.xml"):
              project = ET.parse(pom).getroot()
              version = project.findtext("m:version", namespaces=ns)
              parent_version = project.findtext("m:parent/m:version", namespaces=ns)
              if (version or parent_version) != expected or (pom != "pom.xml" and parent_version != expected):
                  sys.exit(f"{pom}: expected version {expected}, found version={version}, parent={parent_version}")
          PY
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse 'HEAD^{commit}')
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Verify JDK compatibility
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}

  package:
    name: Build release assets
    needs: [validate, compatibility]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build release
        run: mvn --batch-mode --no-transfer-progress -Prelease clean verify

      - name: Stage release assets and notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p target/release/assets
          for suffix in .jar -sources.jar -javadoc.jar; do
            file="beekit-oss-${VERSION}${suffix}"
            test -s "beekit-oss/target/$file"
            cp "beekit-oss/target/$file" "target/release/assets/$file"
          done
          cp pom.xml "target/release/assets/beekit-$VERSION.pom"
          cp beekit-bom/pom.xml "target/release/assets/beekit-bom-$VERSION.pom"
          cp beekit-oss/pom.xml "target/release/assets/beekit-oss-$VERSION.pom"
          git rev-parse HEAD > target/release/commit

          awk -v heading="## $VERSION" '
            copying && /^##[[:space:]]/ { exit }
            $0 == heading { copying = 1; next }
            copying { print }
          ' CHANGELOG.md > target/release/notes.md
          if ! grep -q '[^[:space:]]' target/release/notes.md; then
            echo "::error::CHANGELOG.md must contain a non-empty section headed ## $VERSION."
            exit 1
          fi

      - name: Upload staged files for the release job
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: beekit-release-${{ github.run_attempt }}
          path: target/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download staged files
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: release

      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(release/assets/*)
          if [[ "${#files[@]}" -ne 6 || ! -s release/notes.md || ! -s release/commit ]]; then
            echo "::error::Expected six release files, release notes, and a build commit."
            exit 1
          fi
          commit=$(cat release/commit)
          repo_api="repos/$GITHUB_REPOSITORY"
          require_current_tag() {
            local object sha
            object=$(gh api "$repo_api/git/ref/tags/$RELEASE_TAG" --jq '.object')
            while [[ $(jq -r '.type' <<< "$object") == tag ]]; do
              sha=$(jq -er '.sha' <<< "$object")
              object=$(gh api "$repo_api/git/tags/$sha" --jq '.object')
            done
            if ! jq -e --arg commit "$commit" '.type == "commit" and .sha == $commit' <<< "$object" > /dev/null; then
              echo "::error::The tag no longer points to the commit used to build these assets."
              exit 1
            fi
          }

          require_current_tag
          release_ids=$(gh api --paginate "$repo_api/releases?per_page=100" |
            jq -cs --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag) | .id]')
          case $(jq 'length' <<< "$release_ids") in
            0)
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --target "$commit" --title "BeeKit $RELEASE_TAG" --notes-file release/notes.md
              release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')
              ;;
            1) release_id=$(jq -er '.[0]' <<< "$release_ids") ;;
            *)
              echo "::error::Multiple releases match $RELEASE_TAG."
              exit 1
              ;;
          esac
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unable to identify the release for $RELEASE_TAG."
            exit 1
          fi

          assets=$(gh api --paginate "$repo_api/releases/$release_id/assets?per_page=100" | jq -cs 'add')
          missing=()
          for file in "${files[@]}"; do
            if ! jq -e --arg name "${file##*/}" 'any(.[]; .name == $name)' <<< "$assets" > /dev/null; then
              missing+=("$file")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            require_current_tag
            gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          assets=$(gh api --paginate "$repo_api/releases/$release_id/assets?per_page=100" | jq -cs 'add')
          for file in "${files[@]}"; do
            if ! jq -e --arg name "${file##*/}" 'any(.[]; .name == $name and .state == "uploaded" and .size > 0)' \
              <<< "$assets" > /dev/null; then
              echo "::error::Release asset missing or incomplete: ${file##*/}."
              exit 1
            fi
          done
          is_draft=$(gh api "$repo_api/releases/$release_id" --jq '.draft')
          if [[ "$is_draft" == true ]]; then
            require_current_tag
            gh api --method PATCH "$repo_api/releases/$release_id" \
              -f tag_name="$RELEASE_TAG" -F draft=false --jq '.html_url'
          fi
